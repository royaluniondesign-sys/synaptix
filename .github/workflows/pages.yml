name: Publish site (GitHub Pages)

# Publishes the static site (site/ plus the browser-only demo) to GitHub Pages.
# It runs when a change to the site itself reaches main, and it can still be started
# by hand from the Actions tab. Changes to the application (packages/**) do not
# publish anything, so unreviewed UI work never goes live by accident. The page
# tests run first; if they fail, nothing is deployed.
# Requires Settings > Pages > Build and deployment > Source = "GitHub Actions".
# See docs/site-publishing.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-site.mjs'
      - 'assets/synaptix-logo.svg'
      - '.github/workflows/pages.yml'

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check page content
        run: node --test scripts/__tests__/site.test.mjs

      - name: Build the demo
        run: npm run build:demo -w @synaptix/web

      - name: Assemble the site
        run: node scripts/build-site.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
