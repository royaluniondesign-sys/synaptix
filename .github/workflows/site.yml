name: Public site

# Builds the static public site (site/ plus the browser-only demo) and keeps it
# as a 7-day workflow artifact. Nothing here deploys or publishes: putting the
# site online is a separate decision.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'packages/web/**'
      - 'scripts/build-site.mjs'
      - 'scripts/__tests__/site.test.mjs'
      - '.github/workflows/site.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'packages/web/**'
      - 'scripts/build-site.mjs'
      - 'scripts/__tests__/site.test.mjs'
      - '.github/workflows/site.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check page content
        run: node --test scripts/__tests__/site.test.mjs

      - name: Build the demo
        run: npm run build:demo -w @termora/web

      - name: Assemble the site
        run: node scripts/build-site.mjs

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: termora-site
          path: site-dist
          retention-days: 7
          if-no-files-found: error
