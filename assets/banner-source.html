<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Synaptix banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1280px; height: 640px; overflow: hidden;
    background: #09090b;
    font-family: 'Inter', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .bg-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(113,112,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(113,112,255,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .glow-left  { position:absolute; left:-80px;  top:50%; transform:translateY(-50%); width:500px; height:500px; border-radius:50%; background:radial-gradient(circle,rgba(113,112,255,0.15) 0%,transparent 70%); pointer-events:none; }
  .glow-right { position:absolute; right:-80px; top:50%; transform:translateY(-50%); width:500px; height:500px; border-radius:50%; background:radial-gradient(circle,rgba(167,139,250,0.1) 0%,transparent 70%); pointer-events:none; }

  .card {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 56px;
    padding: 64px 72px;
    border: 1px solid rgba(113,112,255,0.18);
    border-radius: 24px;
    background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(113,112,255,0.04) 100%);
    backdrop-filter: blur(12px);
    max-width: 1100px; width: 100%;
  }

  /* — Logo — */
  .logo-wrap { flex-shrink: 0; }
  .logo-wrap svg { display: block; }

  /* — Text — */
  .copy { flex: 1; min-width: 0; }
  .wordmark {
    font-size: 72px; font-weight: 800; letter-spacing: -2px; line-height: 1;
    background: linear-gradient(135deg, #f4f4f5 30%, #a78bfa 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .tagline {
    margin-top: 16px;
    font-size: 22px; font-weight: 400; color: #a1a1aa; letter-spacing: -0.2px;
    line-height: 1.45;
  }
  .tagline strong { color: #c4b5fd; font-weight: 600; }

  /* — Pill tags — */
  .tags { display: flex; gap: 10px; margin-top: 28px; flex-wrap: wrap; }
  .tag {
    padding: 6px 16px; border-radius: 100px;
    border: 1px solid rgba(113,112,255,0.3);
    background: rgba(113,112,255,0.08);
    color: #a78bfa; font-size: 13px; font-weight: 500; letter-spacing: 0.2px;
  }

  /* — Divider — */
  .divider {
    width: 1px; height: 160px; flex-shrink: 0;
    background: linear-gradient(to bottom, transparent, rgba(113,112,255,0.25), transparent);
  }

  /* — Stats — */
  .stats { display: flex; flex-direction: column; gap: 28px; flex-shrink: 0; }
  .stat-row { text-align: right; }
  .stat-num { font-size: 28px; font-weight: 700; color: #f4f4f5; letter-spacing: -0.5px; }
  .stat-label { font-size: 12px; font-weight: 500; color: #52525b; letter-spacing: 0.5px; text-transform: uppercase; margin-top: 2px; }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow-left"></div>
  <div class="glow-right"></div>

  <div class="card">
    <!-- Logo -->
    <div class="logo-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
        <line x1="48" y1="48" x2="20" y2="20" stroke="#7170ff" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
        <line x1="48" y1="48" x2="76" y2="20" stroke="#7170ff" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
        <line x1="48" y1="48" x2="20" y2="76" stroke="#7170ff" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
        <line x1="48" y1="48" x2="76" y2="76" stroke="#7170ff" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
        <line x1="48" y1="48" x2="48" y2="10"  stroke="#7170ff" stroke-width="2.4" stroke-linecap="round" opacity="0.35"/>
        <line x1="48" y1="48" x2="48" y2="86"  stroke="#7170ff" stroke-width="2.4" stroke-linecap="round" opacity="0.35"/>
        <line x1="48" y1="48" x2="10" y2="48"  stroke="#7170ff" stroke-width="2.4" stroke-linecap="round" opacity="0.35"/>
        <line x1="48" y1="48" x2="86" y2="48"  stroke="#7170ff" stroke-width="2.4" stroke-linecap="round" opacity="0.35"/>
        <line x1="20" y1="20" x2="76" y2="20" stroke="#a78bfa" stroke-width="1.4" stroke-linecap="round" opacity="0.25"/>
        <line x1="20" y1="20" x2="20" y2="76" stroke="#a78bfa" stroke-width="1.4" stroke-linecap="round" opacity="0.25"/>
        <line x1="76" y1="76" x2="20" y2="76" stroke="#a78bfa" stroke-width="1.4" stroke-linecap="round" opacity="0.25"/>
        <line x1="76" y1="76" x2="76" y2="20" stroke="#a78bfa" stroke-width="1.4" stroke-linecap="round" opacity="0.25"/>
        <circle cx="20" cy="20" r="6"  fill="#a78bfa" opacity="0.85"/>
        <circle cx="76" cy="20" r="6"  fill="#7170ff" opacity="0.85"/>
        <circle cx="20" cy="76" r="6"  fill="#7170ff" opacity="0.85"/>
        <circle cx="76" cy="76" r="6"  fill="#a78bfa" opacity="0.85"/>
        <circle cx="48" cy="10" r="3.5" fill="#6366f1" opacity="0.6"/>
        <circle cx="48" cy="86" r="3.5" fill="#6366f1" opacity="0.6"/>
        <circle cx="10" cy="48" r="3.5" fill="#6366f1" opacity="0.6"/>
        <circle cx="86" cy="48" r="3.5" fill="#6366f1" opacity="0.6"/>
        <circle cx="48" cy="48" r="15" fill="url(#hubG)"/>
        <circle cx="48" cy="48" r="10" fill="#7170ff"/>
        <circle cx="48" cy="48" r="5"  fill="#c4b5fd"/>
        <defs>
          <radialGradient id="hubG" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#7170ff" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#7170ff" stop-opacity="0"/>
          </radialGradient>
        </defs>
      </svg>
    </div>

    <!-- Copy -->
    <div class="copy">
      <div class="wordmark">Synaptix</div>
      <div class="tagline">
        AI agent orchestration for your <strong>local machine</strong> —<br/>
        real terminals, real tools, real connections.
      </div>
      <div class="tags">
        <span class="tag">AI Agents</span>
        <span class="tag">Terminal</span>
        <span class="tag">Open Source</span>
        <span class="tag">TypeScript</span>
        <span class="tag">Self-hosted</span>
      </div>
    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-row">
        <div class="stat-num">5+</div>
        <div class="stat-label">AI Providers</div>
      </div>
      <div class="stat-row">
        <div class="stat-num">PTY</div>
        <div class="stat-label">Real Terminals</div>
      </div>
      <div class="stat-row">
        <div class="stat-num">Local</div>
        <div class="stat-label">Privacy First</div>
      </div>
    </div>
  </div>
</body>
</html>
