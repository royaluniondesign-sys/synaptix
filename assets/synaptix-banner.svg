<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08090a"/>
      <stop offset="100%" stop-color="#0c0d10"/>
    </linearGradient>
    <radialGradient id="glow" cx="900" cy="280" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7170ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7170ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7170ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7170ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7170ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#7170ff" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7170ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="winShadow" x="-5%" y="-5%" width="115%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dx="0" dy="12"/>
      <feComposite in2="SourceGraphic" operator="out"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="560" fill="url(#bg)"/>
  <rect width="1280" height="560" fill="url(#glow)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="16" cy="16" r="1" fill="#ffffff" fill-opacity="0.025"/>
  </pattern>
  <rect width="1280" height="560" fill="url(#dots)"/>

  <!-- Accent bar top -->
  <rect width="1280" height="2" fill="url(#accentBar)"/>

  <!-- ===== LEFT: Brand ===== -->

  <!-- Logo mark at 72,200 -->
  <g transform="translate(72,196)">
    <line x1="36" y1="36" x2="8"  y2="8"  stroke="#7170ff" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
    <line x1="36" y1="36" x2="64" y2="8"  stroke="#7170ff" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
    <line x1="36" y1="36" x2="8"  y2="64" stroke="#7170ff" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
    <line x1="36" y1="36" x2="64" y2="64" stroke="#7170ff" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
    <line x1="36" y1="36" x2="36" y2="2"  stroke="#7170ff" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
    <line x1="36" y1="36" x2="36" y2="70" stroke="#7170ff" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
    <line x1="36" y1="36" x2="2"  y2="36" stroke="#7170ff" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
    <line x1="36" y1="36" x2="70" y2="36" stroke="#7170ff" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
    <circle cx="8"  cy="8"  r="5.5" fill="#a78bfa" opacity="0.9"/>
    <circle cx="64" cy="8"  r="5.5" fill="#7170ff" opacity="0.9"/>
    <circle cx="8"  cy="64" r="5.5" fill="#7170ff" opacity="0.9"/>
    <circle cx="64" cy="64" r="5.5" fill="#a78bfa" opacity="0.9"/>
    <circle cx="36" cy="2"  r="3"   fill="#6366f1" opacity="0.6"/>
    <circle cx="36" cy="70" r="3"   fill="#6366f1" opacity="0.6"/>
    <circle cx="2"  cy="36" r="3"   fill="#6366f1" opacity="0.6"/>
    <circle cx="70" cy="36" r="3"   fill="#6366f1" opacity="0.6"/>
    <circle cx="36" cy="36" r="14"  fill="url(#centerGlow)"/>
    <circle cx="36" cy="36" r="9"   fill="#7170ff"/>
    <circle cx="36" cy="36" r="4.5" fill="#c4b5fd"/>
  </g>

  <!-- Wordmark -->
  <text x="72" y="316" font-family="'-apple-system','Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="700" fill="#f4f4f5" letter-spacing="-2">Synaptix</text>

  <!-- Tagline -->
  <text x="74" y="352" font-family="'-apple-system','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#71717a" letter-spacing="0.1">AI agent orchestration. Real terminals. Your machine.</text>

  <!-- Tags -->
  <g transform="translate(74,378)">
    <!-- PTY -->
    <rect width="46" height="22" rx="5" fill="#7170ff" fill-opacity="0.1" stroke="#7170ff" stroke-opacity="0.35" stroke-width="1"/>
    <text x="23" y="15.5" text-anchor="middle" font-family="monospace" font-size="11" fill="#a78bfa">PTY</text>
    <!-- WS -->
    <rect x="54" width="94" height="22" rx="5" fill="#7170ff" fill-opacity="0.1" stroke="#7170ff" stroke-opacity="0.35" stroke-width="1"/>
    <text x="101" y="15.5" text-anchor="middle" font-family="monospace" font-size="11" fill="#a78bfa">WebSocket</text>
    <!-- Local -->
    <rect x="156" width="84" height="22" rx="5" fill="#7170ff" fill-opacity="0.1" stroke="#7170ff" stroke-opacity="0.35" stroke-width="1"/>
    <text x="198" y="15.5" text-anchor="middle" font-family="monospace" font-size="11" fill="#a78bfa">Local-first</text>
    <!-- PWA -->
    <rect x="248" width="48" height="22" rx="5" fill="#7170ff" fill-opacity="0.1" stroke="#7170ff" stroke-opacity="0.35" stroke-width="1"/>
    <text x="272" y="15.5" text-anchor="middle" font-family="monospace" font-size="11" fill="#a78bfa">PWA</text>
    <!-- MIT -->
    <rect x="304" width="42" height="22" rx="5" fill="#7170ff" fill-opacity="0.1" stroke="#7170ff" stroke-opacity="0.35" stroke-width="1"/>
    <text x="325" y="15.5" text-anchor="middle" font-family="monospace" font-size="11" fill="#a78bfa">MIT</text>
  </g>

  <!-- ===== RIGHT: App window mockup ===== -->
  <g transform="translate(458,34)" filter="url(#winShadow)">
    <!-- Window frame -->
    <rect width="784" height="492" rx="11" fill="#0f1011" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

    <!-- Titlebar -->
    <rect width="784" height="36" rx="11" fill="#181819"/>
    <rect y="22" width="784" height="14" fill="#181819"/>
    <circle cx="14" cy="18" r="6" fill="#ff5f57" opacity="0.85"/>
    <circle cx="34" cy="18" r="6" fill="#febc2e" opacity="0.85"/>
    <circle cx="54" cy="18" r="6" fill="#28c840" opacity="0.85"/>
    <text x="392" y="22" text-anchor="middle" font-family="'-apple-system',sans-serif" font-size="12" fill="#52525b">Synaptix</text>

    <!-- Top command bar -->
    <rect x="0" y="36" width="784" height="32" fill="#0f1011" stroke="none"/>
    <line x1="0" y1="68" x2="784" y2="68" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <!-- Command buttons -->
    <rect x="8" y="42" width="100" height="20" rx="5" fill="#1c1c1f" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="58" y="56" text-anchor="middle" font-family="'-apple-system',sans-serif" font-size="11" fill="#a1a1aa">+ new terminal</text>
    <rect x="116" y="42" width="100" height="20" rx="5" fill="#1c1c1f" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="166" y="56" text-anchor="middle" font-family="'-apple-system',sans-serif" font-size="11" fill="#a1a1aa">spawn agent</text>
    <rect x="224" y="42" width="108" height="20" rx="5" fill="#1c1c1f" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="278" y="56" text-anchor="middle" font-family="'-apple-system',sans-serif" font-size="11" fill="#a1a1aa">open file tree</text>
    <rect x="648" y="42" width="124" height="20" rx="5" fill="#7170ff" fill-opacity="0.15" stroke="#7170ff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="710" y="56" text-anchor="middle" font-family="'-apple-system',sans-serif" font-size="11" fill="#a78bfa">⌘K  quick action</text>

    <!-- Sidebar icons -->
    <rect x="0" y="68" width="44" height="424" fill="#0c0d0e"/>
    <!-- active: dashboard -->
    <rect x="6" y="80" width="32" height="30" rx="7" fill="#7170ff" fill-opacity="0.15"/>
    <rect x="11" y="85" width="10" height="9" rx="2" fill="#7170ff"/>
    <rect x="23" y="85" width="10" height="9" rx="2" fill="#7170ff" fill-opacity="0.45"/>
    <rect x="11" y="96" width="10" height="9" rx="2" fill="#7170ff" fill-opacity="0.45"/>
    <rect x="23" y="96" width="10" height="9" rx="2" fill="#7170ff" fill-opacity="0.45"/>
    <!-- terminal -->
    <polyline points="11,128 17,134 11,140" fill="none" stroke="#3f3f46" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="20" y1="140" x2="33" y2="140" stroke="#3f3f46" stroke-width="1.6" stroke-linecap="round"/>
    <!-- agents -->
    <circle cx="22" cy="164" r="5" fill="none" stroke="#3f3f46" stroke-width="1.4"/>
    <circle cx="13" cy="172" r="3" fill="none" stroke="#3f3f46" stroke-width="1.2"/>
    <circle cx="31" cy="172" r="3" fill="none" stroke="#3f3f46" stroke-width="1.2"/>
    <line x1="16" y1="170" x2="18" y2="168" stroke="#3f3f46" stroke-width="1"/>
    <line x1="28" y1="170" x2="26" y2="168" stroke="#3f3f46" stroke-width="1"/>
    <!-- settings bottom -->
    <circle cx="22" cy="474" r="7" fill="none" stroke="#3f3f46" stroke-width="1.4"/>
    <circle cx="22" cy="474" r="3" fill="none" stroke="#3f3f46" stroke-width="1.4"/>
    <!-- sidebar divider -->
    <line x1="44" y1="68" x2="44" y2="492" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

    <!-- Left panel: sessions/agents list -->
    <rect x="44" y="68" width="188" height="424" fill="#0e0f10"/>
    <line x1="232" y1="68" x2="232" y2="492" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

    <!-- Sessions header -->
    <text x="56" y="90" font-family="'-apple-system',sans-serif" font-size="9.5" fill="#3f3f46" letter-spacing="0.9">SESSIONS</text>

    <!-- Session 1 (active) -->
    <rect x="48" y="96" width="180" height="38" rx="6" fill="#7170ff" fill-opacity="0.1" stroke="#7170ff" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="62" cy="115" r="4" fill="#10b981"/>
    <text x="72" y="111" font-family="'-apple-system',sans-serif" font-size="12" font-weight="600" fill="#f4f4f5">main</text>
    <text x="72" y="125" font-family="monospace" font-size="9.5" fill="#52525b">~/Termora</text>

    <!-- Session 2 -->
    <circle cx="62" cy="151" r="4" fill="#10b981"/>
    <text x="72" y="147" font-family="'-apple-system',sans-serif" font-size="12" fill="#71717a">agent-worker</text>
    <text x="72" y="161" font-family="monospace" font-size="9.5" fill="#3f3f46">claude code running</text>

    <!-- Session 3 -->
    <circle cx="62" cy="183" r="4" fill="#3f3f46"/>
    <text x="72" y="179" font-family="'-apple-system',sans-serif" font-size="12" fill="#52525b">build-watch</text>
    <text x="72" y="193" font-family="monospace" font-size="9.5" fill="#3f3f46">idle</text>

    <line x1="52" y1="206" x2="224" y2="206" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

    <!-- Agents header -->
    <text x="56" y="224" font-family="'-apple-system',sans-serif" font-size="9.5" fill="#3f3f46" letter-spacing="0.9">AGENTS</text>

    <!-- Agent 1 -->
    <circle cx="62" cy="243" r="4" fill="#7170ff"/>
    <text x="72" y="239" font-family="'-apple-system',sans-serif" font-size="12" fill="#a1a1aa">claude-code</text>
    <text x="72" y="252" font-family="monospace" font-size="9.5" fill="#7170ff">THINKING •••</text>

    <!-- Agent 2 -->
    <circle cx="62" cy="272" r="4" fill="#3f3f46"/>
    <text x="72" y="268" font-family="'-apple-system',sans-serif" font-size="12" fill="#52525b">opencode</text>
    <text x="72" y="281" font-family="monospace" font-size="9.5" fill="#3f3f46">IDLE</text>

    <!-- ===== Terminal pane ===== -->
    <rect x="232" y="68" width="552" height="424" fill="#09090b"/>

    <!-- Tab bar -->
    <rect x="232" y="68" width="552" height="30" fill="#0c0d0e"/>
    <rect x="236" y="72" width="72" height="22" rx="5" fill="#09090b" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="272" y="87" text-anchor="middle" font-family="'-apple-system',sans-serif" font-size="11" fill="#e4e4e7">main</text>
    <text x="322" y="87" font-family="'-apple-system',sans-serif" font-size="11" fill="#3f3f46">agent-worker</text>
    <line x1="232" y1="98" x2="784" y2="98" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

    <!-- Terminal output lines -->
    <text x="248" y="122" font-family="monospace" font-size="12" fill="#52525b">~/Documents/Termora</text>
    <text x="248" y="140" font-family="monospace" font-size="12" fill="#7170ff">❯</text>
    <text x="265" y="140" font-family="monospace" font-size="12" fill="#f4f4f5">npx turbo run build</text>

    <text x="248" y="160" font-family="monospace" font-size="11" fill="#3f3f46"> • Packages in scope: agent, web, cli</text>
    <text x="248" y="177" font-family="monospace" font-size="11" fill="#3f3f46"> • Running build in 3 packages</text>
    <text x="248" y="194" font-family="monospace" font-size="11" fill="#10b981">@synaptix/agent:build: cache hit, replaying</text>
    <text x="248" y="211" font-family="monospace" font-size="11" fill="#10b981">@synaptix/web:build: cache hit, replaying</text>
    <text x="248" y="228" font-family="monospace" font-size="11" fill="#10b981">@synaptix/cli:build:   ✓ built in 1.24s</text>
    <text x="248" y="258" font-family="monospace" font-size="11" fill="#10b981"> Tasks:    3 successful, 3 total</text>
    <text x="248" y="275" font-family="monospace" font-size="11" fill="#52525b"> Cached:   2 cached, 3 total</text>
    <text x="248" y="292" font-family="monospace" font-size="11" fill="#52525b"> Time:     823ms &gt;&gt;&gt; SAVED 14s</text>

    <!-- Next prompt with cursor -->
    <text x="248" y="320" font-family="monospace" font-size="12" fill="#7170ff">❯</text>
    <rect x="265" y="306" width="9" height="17" fill="#7170ff" fill-opacity="0.9" rx="1"/>

    <!-- Status bar at bottom of terminal -->
    <rect x="232" y="452" width="552" height="40" fill="#0c0d0e"/>
    <line x1="232" y1="452" x2="784" y2="452" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <circle cx="252" cy="472" r="4" fill="#10b981"/>
    <text x="262" y="476" font-family="monospace" font-size="10" fill="#52525b">connected · 4ms</text>
    <circle cx="368" cy="472" r="4" fill="#7170ff"/>
    <text x="378" y="476" font-family="monospace" font-size="10" fill="#52525b">1 agent active</text>
    <circle cx="472" cy="472" r="4" fill="#3f3f46"/>
    <text x="482" y="476" font-family="monospace" font-size="10" fill="#52525b">3 sessions</text>
    <text x="776" y="476" text-anchor="end" font-family="monospace" font-size="10" fill="#3f3f46">v0.2.0</text>
  </g>
</svg>
